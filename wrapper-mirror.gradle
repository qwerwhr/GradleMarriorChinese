// ============================================================
// Gradle Wrapper 分发下载镜像 + 版本自动同步（永久，新建/克隆项目均生效）
// 阿里云镜像（主） + 清华 TUNA 镜像（备）
// 策略：
//   1. services.gradle.org → 阿里云镜像
//   2. 版本号自动跟随当前运行的 Gradle（如 9.5.0 → 9.6.1）
//   3. 保留 bin/all 类型不变
// ============================================================

// 国内镜像地址
def GRADLE_DIST_MIRROR_PRIMARY   = 'https://mirrors.aliyun.com/gradle/distributions/'
def GRADLE_DIST_MIRROR_FALLBACK  = 'https://mirrors.tuna.tsinghua.edu.cn/gradle/distributions/'
def GRADLE_DIST_ORIGINAL         = 'https://services.gradle.org/distributions/'

// 当前系统 Gradle 版本号
def CURRENT_VERSION = GradleVersion.current().version
// 匹配版本号的公共函数：gradle-X.Y.Z-xxx.zip → gradle-<current>-xxx.zip
def upgradeVersion = { String url ->
    def type = (url.contains('-all.zip')) ? '-all.zip' : '-bin.zip'
    return "${GRADLE_DIST_MIRROR_PRIMARY}gradle-${CURRENT_VERSION}${type}"
}

// ========== 1. gradle wrapper 命令自动使用镜像 + 同步版本 ==========
// 兼容 Gradle 9.5（distributionUrl 为 String）和 9.6+（为 Provider<String>）
allprojects {
    tasks.withType(Wrapper).configureEach {
        def raw = distributionUrl
        if (raw instanceof org.gradle.api.provider.Provider) {
            raw = raw.get()
        }
        def updated = raw
            .replace(GRADLE_DIST_ORIGINAL, GRADLE_DIST_MIRROR_PRIMARY)

        // 提取当前 URL 中的版本号，如果与系统版本不同则升级
        def matcher = (updated =~ /gradle-(\d+\.\d+(?:\.\d+)?)/)
        if (matcher.find()) {
            def urlVersion = matcher.group(1)
            if (urlVersion != CURRENT_VERSION) {
                updated = upgradeVersion(updated)
            }
        }
        distributionUrl = updated
    }
}

// ========== 2. 自动修复已有项目的 wrapper properties ==========
gradle.rootProject { project ->
    def wrapperPropsFile = project.file('gradle/wrapper/gradle-wrapper.properties')
    if (wrapperPropsFile.exists()) {
        def props = new java.util.Properties()
        wrapperPropsFile.withInputStream { props.load(it) }
        def url = props.getProperty('distributionUrl', '')
        if (!url) return

        def newUrl = url
        def changed = false

        // 2a. 替换为镜像域名
        if (newUrl.contains('services.gradle.org')) {
            newUrl = newUrl.replace(
                'https\\://services.gradle.org/distributions/',
                'https\\://mirrors.aliyun.com/gradle/distributions/'
            )
            changed = true
        }

        // 2b. 版本号升级到当前系统版本
        def versionMatcher = (newUrl =~ /gradle-(\d+\.\d+(?:\.\d+)?)/)
        if (versionMatcher.find()) {
            def oldVersion = versionMatcher.group(1)
            if (oldVersion != CURRENT_VERSION) {
                newUrl = upgradeVersion(newUrl)
                changed = true
                logger.lifecycle(
                    '[镜像] 已升级 Gradle Wrapper: {} → {} (来自 {})',
                    oldVersion, CURRENT_VERSION, project.name
                )
            }
        }

        if (changed) {
            props.setProperty('distributionUrl', newUrl)
            wrapperPropsFile.withOutputStream { props.store(it, null) }
            logger.lifecycle('[镜像] 已自动修复 wrapper → 阿里云镜像, gradle-{}', CURRENT_VERSION)
        }
    }
}
